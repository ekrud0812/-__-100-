function startGame(){

const dept =
document.getElementById("dept").value.trim();

const username =
document.getElementById("username").value.trim();

const phone =
document.getElementById("phone").value
.replace(/-/g,"")
.trim();

if(
dept==="" ||
username==="" ||
phone===""
){

alert("정보를 모두 입력하세요");
return;

}

if(!/^[0-9]{8,13}$/.test(phone)){

alert("전화번호를 숫자만 입력하세요");
return;

}

fetch(
"https://script.google.com/macros/s/AKfycbwTYmCfMGm0i6dkaz_C5JDhGQ687pbhgOpKOwRsPcQg8YDgmWpF_lC0KO1SuyRgw8qU8g/exec?phone="+phone
)

.then(res=>res.text())

.then(result=>{

if(result==="duplicate"){

alert("이미 참여한 전화번호입니다.");
return;

}

startRealGame();

})

.catch(err=>{

console.log(err);

/* 중복검사 실패해도 게임 시작 */
startRealGame();

});

}

function startRealGame(){

score = 0;
current = 0;

document.getElementById("score").innerText = "점수 0점";

document.getElementById("start").style.display="none";

questions.sort(()=>Math.random()-0.5);

document.getElementById("progressBar").max = totalQuestions;

document.getElementById("game").style.display="block";

loadQuestion();

}

function loadQuestion(){

if(current>=questions.length){

winGame();
return;

}

time=10;

document.getElementById("timer").innerText=time;

document.getElementById("question").innerText=
questions[current].q;

document.getElementById("progressText").innerText=
"진행률 "+(current+1)+"/"+totalQuestions;

document.getElementById("progressBar").value=current+1;

clearInterval(interval);

interval=setInterval(function(){

time--;

document.getElementById("timer").innerText=time;

if(time<=0){

gameOver("시간초과");

}

},1000);

}


function answer(choice){

if(choice===questions[current].a){

score+=1;

document.getElementById(
"score"
).innerText=
"점수 "+score+"점";

current++;

loadQuestion();

}

else{

gameOver("오답");

}

}


function gameOver(reason){

document.body.style.animation = "none";

setTimeout(function(){

document.body.style.animation = "shake 0.4s";

},10);

clearInterval(interval);

/* 시트 저장 */
sendScore();

document.getElementById(
"game"
).style.display="none";

document.getElementById(
"result"
).style.display="block";

document.getElementById(
"resultTitle"
).innerText=
"😂감염 Zero 달성 실패😂 ("+reason+")";

document.getElementById(
"finalScore"
).innerText=
"최종점수 "+score+"점";

document.getElementById(
"myResult"
).innerHTML=
"최종 점수 : "+score+"점<br>😂김해복음병원의 감염을 막아내지 못했습니다😂"

}



function winGame(){

clearInterval(interval);

/* 시트 저장 */
sendScore();

document.getElementById(
"game"
).style.display="none";

document.getElementById(
"result"
).style.display="block";

document.getElementById(
"resultTitle"
).innerText=
"❤️완벽한 감염 Zero 달성!❤️";

document.getElementById(
"finalScore"
).innerText=
"최종점수 "+score+"점";

document.getElementById(
"myResult"
).innerHTML=
"🏆당신은 김해복음병원의 '명예 감염관리 직원입니다'!<br>최종 점수 : "+score+"점<br>축하합니다."

}
